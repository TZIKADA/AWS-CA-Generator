[project]
name = "sigvault-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32",
  "boto3>=1.35", "botocore>=1.35",
  "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30", "alembic>=1.14",
  "pyjwt[crypto]>=2.10", "httpx>=0.28",
  "python-gnupg>=0.5", "cryptography>=43",
  "pydantic>=2.10", "pydantic-settings>=2.7",
  "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
