name: deploy
on:
    push:
        { branches: [main], paths: ["apps/**", ".github/workflows/deploy.yml"] }

permissions: { id-token: write, contents: read }

jobs:
    deploy:
        strategy:
            max-parallel: 1
            matrix: { env: [dev, prod] }
        runs-on: ubuntu-latest
        environment: ${{ matrix.env }} # prod requires reviewers
        steps:
            - uses: actions/checkout@v4
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
                  aws-region: ${{ vars.AWS_REGION }}
            - uses: docker/setup-buildx-action@v3
            - uses: aws-actions/amazon-ecr-login@v2
              id: ecr
            - name: Build & push (arm64, immutable sha tag)
              run: |
                  IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA}"
                  docker buildx build --platform linux/arm64 -t "$IMAGE" --push apps/api
                  echo "IMAGE=$IMAGE" >> $GITHUB_ENV

            - name: Run DB migrations (blocks the rollout on failure)
              run: |
                  TASK=$(aws ecs run-task \
                    --cluster "${{ vars.ECS_CLUSTER }}" \
                    --task-definition "${{ vars.MIGRATIONS_TASK_FAMILY }}" \
                    --launch-type FARGATE \
                    --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
                    --query 'tasks[0].taskArn' --output text)
                  aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK"
                  CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK" \
                    --query 'tasks[0].containers[0].exitCode' --output text)
                  [ "$CODE" = "0" ] || { echo "migrations failed (exit $CODE)"; exit 1; }

            - name: Roll API + worker to the new image
              run: |
                  for FAMILY in "${{ vars.API_TASK_FAMILY }}" "${{ vars.WORKER_TASK_FAMILY }}"; do
                    CURRENT=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition)
                    NEW=$(echo "$CURRENT" | jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
                      | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')
                    REV=$(echo "$NEW" | aws ecs register-task-definition --cli-input-json file:///dev/stdin --query 'taskDefinition.revision' --output text)
                    aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "$(basename $FAMILY)" --task-definition "$FAMILY:$REV"
                  done
                  aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services api worker

            - name: Publish SPA
              run: |
                  (cd apps/web && npm ci && npm run build)
                  aws s3 sync apps/web/dist "s3://${{ vars.SITE_BUCKET }}" --delete \
                    --cache-control "public,max-age=31536000,immutable" --exclude index.html --exclude "*.html"
                  aws s3 cp apps/web/dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
                    --cache-control "no-cache,no-store,must-revalidate"
                  aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths /index.html
