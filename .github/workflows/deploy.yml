name: deploy
on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/deploy.yml"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    strategy:
      max-parallel: 1
      matrix:
        env: [dev]
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        run: |
          IMAGE="${{ vars.ECR_REPOSITORY_URL }}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            -f apps/api/Dockerfile.lambda \
            -t "$IMAGE" \
            --push apps/api
          aws lambda update-function-code \
            --function-name "${{ vars.API_FUNCTION_NAME }}" \
            --image-uri "$IMAGE"
          aws lambda update-function-code \
            --function-name "${{ vars.WORKER_FUNCTION_NAME }}" \
            --image-uri "$IMAGE"
          aws lambda wait function-updated --function-name "${{ vars.API_FUNCTION_NAME }}"
          aws lambda wait function-updated --function-name "${{ vars.WORKER_FUNCTION_NAME }}"

      - name: Publish SPA
        run: |
          (cd apps/web &&
            VITE_COGNITO_DOMAIN="${{ vars.COGNITO_HOSTED_UI_DOMAIN }}" \
            VITE_COGNITO_CLIENT_ID="${{ vars.COGNITO_CLIENT_ID }}" \
            npm ci && npm run build)
          aws s3 sync apps/web/dist "s3://${{ vars.SITE_BUCKET }}" --delete \
            --cache-control "public,max-age=31536000,immutable" --exclude index.html --exclude "*.html"
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths /index.html
