name: infra
on:
    pull_request: { paths: ["infra/**"] }
    push: { branches: [main], paths: ["infra/**"] }

permissions: { id-token: write, contents: read }

jobs:
    plan:
        strategy:
            matrix: { env: [dev] }
        runs-on: ubuntu-latest
        environment: ${{ matrix.env }}-infra
        steps:
            - uses: actions/checkout@v4
            - uses: hashicorp/setup-terraform@v3
              with: { terraform_version: "1.10.0" }
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.DEV_TF_PLAN_ROLE_ARN }}
                  aws-region: eu-west-1
            - run: terraform fmt -check -recursive
              working-directory: infra/terraform
            - run: terraform init -backend=false
              working-directory: infra/terraform/bootstrap
            - run: terraform validate
              working-directory: infra/terraform/bootstrap
            - run: terraform init -backend-config=envs/${{ matrix.env }}.backend.hcl
              working-directory: infra/terraform/app
            - run: terraform validate
              working-directory: infra/terraform/app
            - run: terraform plan -var-file=envs/${{ matrix.env }}.tfvars -no-color
              working-directory: infra/terraform/app

    apply:
        if: github.event_name == 'push'
        needs: plan
        strategy:
            max-parallel: 1
            matrix: { env: [dev] }
        runs-on: ubuntu-latest
        environment: ${{ matrix.env }}-infra # prod-infra requires reviewers
        steps:
            - uses: actions/checkout@v4
            - uses: hashicorp/setup-terraform@v3
              with: { terraform_version: "1.10.0" }
            - uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
                  aws-region: eu-west-1
            - run: terraform init -backend-config=envs/${{ matrix.env }}.backend.hcl
              working-directory: infra/terraform/app
            - run: terraform apply -auto-approve -var-file=envs/${{ matrix.env }}.tfvars
              working-directory: infra/terraform/app
